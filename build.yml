name: Build plugin jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
        run: |
          gradle wrapper
          ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBridge
          path: build/libs/DiscordBridge.jar
